  <rect width="1200" height="420" rx="28" fill="url(#glowA)"/>
  <rect width="1200" height="420" rx="28" fill="url(#glowB)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="27.25" stroke="#C9D3F2" stroke-opacity="0.12" stroke-width="1.5"/>

  <circle cx="74" cy="68" r="4" fill="#72B9FF"/>
  <circle cx="94" cy="68" r="4" fill="#9A88FF"/>
