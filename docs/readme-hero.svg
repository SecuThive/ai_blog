<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nodelog</title>
  <desc id="desc">AI draft, human review. Practical intelligence for builders.</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="18" x2="1130" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B13"/>
      <stop offset="0.52" stop-color="#101426"/>
      <stop offset="1" stop-color="#090B12"/>
    </linearGradient>
    <linearGradient id="brand" x1="367" y1="134" x2="853" y2="268" gradientUnits="userSpaceOnUse">
      <stop stop-color="#80BDFF"/>
      <stop offset="0.48" stop-color="#9B8AFF"/>
      <stop offset="1" stop-color="#D886FF"/>
    </linearGradient>
    <linearGradient id="line" x1="142" y1="0" x2="1075" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#75B9FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9E89FF"/>
      <stop offset="1" stop-color="#D583FF" stop-opacity="0"/>
