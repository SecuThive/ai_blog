    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(902 324) rotate(-145) scale(328 230)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B653F1" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#B653F1" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
