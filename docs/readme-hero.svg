  <text x="600" y="265" text-anchor="middle" fill="#DCE3F4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="500" letter-spacing="4">AI DRAFT · HUMAN REVIEW</text>
